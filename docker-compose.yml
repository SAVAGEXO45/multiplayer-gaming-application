services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_arena_app
    restart: always
    ports:
      - "80:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
    volumes:
      - app_data:/app/database
      - app_storage:/app/storage

volumes:
  app_data:
  app_storage:
